name: fog_snipex_memk_v3_ksun

on:
  workflow_dispatch:

jobs:
  build:
    name: build v3_fog_snipex_memk_ksun
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Kernel Source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up MemKernel as a module (M-OUT) with specified name
        run: |
          curl -LSs "https://raw.githubusercontent.com/tanvirlinux5/MemKernel/main/kernel/setup.sh" | bash -s M fog_snipex

      - name: Fix MemKernel mmap_lock API
        run: |
          sed -i 's/->mmap_sem/->mmap_lock/g' \
            drivers/memkernel/memory.c \
            drivers/memkernel/process.c
            
      - name: Set up Ksu next
        run: |
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s stable

      - name: Setup Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex \
            git gnupg gperf libelf-dev libncurses5-dev libssl-dev lzop make \
            optipng pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev libtinfo5

      - name: Download Proton Clang 13
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Build Kernel Image.gz
        run: |
          set -e

          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          make O=out ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            vendor/fog-perf_defconfig

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            Image.gz

      - name: Build MemKernel module
        run: |
          set -e

          export PATH="${GITHUB_WORKSPACE}/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64

          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            M=drivers/memkernel modules

      - name: Verify build outputs
        run: |
          set -e

          test -s out/arch/arm64/boot/Image.gz
          test -s out/drivers/memkernel/fog_snipex_memk.ko

          echo "=== Image.gz ==="
          ls -lh out/arch/arm64/boot/Image.gz

          echo "=== MemKernel module ==="
          ls -lh out/drivers/memkernel/fog_snipex_memk.ko

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: fog_snipex_memk_v3_ksun
          path: |
            out/arch/arm64/boot/Image.gz
            out/drivers/memkernel/fog_snipex_memk.ko
          if-no-files-found: error
          retention-days: 14
